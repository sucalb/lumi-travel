<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tour du lịch — Lumi Travel</title>
  <meta name="description" content="Danh sách tour du lịch Trung Quốc, Châu Á và trong nước của Lumi Travel." />
  <meta name="theme-color" content="#0a2470" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script>try{if(sessionStorage.getItem('ts-pt')==='1')document.documentElement.classList.add('pt-in')}catch(e){}</script>
</head>
<body class="page-list">
  <div class="pt" aria-hidden="true"><i class="pt__layer"></i><i class="pt__layer"></i><div class="pt__brand">LUMI <span>TRAVEL</span></div><svg class="pt__plane" viewBox="0 0 64 64"><path d="M60 28 40 26 24 4h-6l8 22-14-1-6-7H1l4 14-4 14h5l6-7 14-1-8 22h6l16-22 20-2a4 4 0 0 0 0-8z"/></svg></div>
  <div class="progress" aria-hidden="true"><i></i><svg class="progress__plane" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
  <header id="siteHeader" class="header header--solid is-scrolled"></header>
  <main id="top">
    <section class="page-hero" id="pageHero">
      <div class="page-hero__bg" id="pageHeroBg"></div>
      <div class="container page-hero__inner">
        <nav class="crumbs"><a href="./">Trang chủ</a><span>/</span><b id="crumbCur">Tour du lịch</b></nav>
        <h1 class="page-hero__title" id="listTitle">Tour du lịch</h1>
        <p class="page-hero__sub" id="listSub">Tìm hành trình phù hợp với bạn</p>
      </div>
    </section>
    <section class="listing container">
      <aside class="filters-panel" id="filtersPanel">
        <div class="filters-panel__head"><b>Bộ lọc</b><button class="link-btn" id="resetFilters">Xóa lọc</button></div>
        <label class="fsearch"><svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg><input id="fQ" placeholder="Tìm tên tour, điểm đến…" /></label>
        <div class="fgroup"><h4>Loại tour</h4><div class="chips" id="fCat"></div></div>
        <div class="fgroup"><h4>Điểm khởi hành</h4><div class="chips" id="fFrom"></div></div>
        <div class="fgroup"><h4>Điểm đến</h4><div class="chips chips--scroll" id="fDest"></div></div>
        <div class="fgroup"><h4>Ngân sách tối đa: <b id="fPriceVal"></b></h4><input type="range" id="fPrice" min="0" max="50000000" step="500000" /></div>
        <div class="fgroup"><h4>Số ngày</h4><div class="chips" id="fDays"></div></div>
      </aside>
      <div class="results">
        <div class="results__bar">
          <p id="resultCount">Đang tải…</p>
          <div class="results__tools">
            <button class="btn btn--outline btn--sm filters-toggle" id="filtersToggle">Bộ lọc</button>
            <select id="fSort" class="select"><option value="pop">Phổ biến nhất</option><option value="asc">Giá thấp → cao</option><option value="desc">Giá cao → thấp</option><option value="days">Số ngày</option></select>
          </div>
        </div>
        <div class="grid-tours grid-tours--3" id="results"></div>
        <div class="empty" id="empty" hidden>
          <svg viewBox="0 0 64 64"><path d="M60 28 40 26 24 4h-6l8 22-14-1-6-7H1l4 14-4 14h5l6-7 14-1-8 22h6l16-22 20-2a4 4 0 0 0 0-8z"/></svg>
          <h3>Chưa có tour phù hợp</h3><p>Thử bỏ bớt bộ lọc hoặc gọi hotline để Lumi Travel thiết kế tour riêng cho bạn.</p>
          <a href="./#contact" class="btn btn--gold">Yêu cầu tour riêng</a>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer" id="siteFooter"></footer>
  <div class="fabs" id="fab"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Flip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/tours.js"></script>
</body>
</html>
