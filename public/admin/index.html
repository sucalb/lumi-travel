<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Quản trị — Lumi Travel</title>
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <!-- Login -->
  <section class="login" id="login" hidden>
    <div class="login__art" aria-hidden="true">
      <svg class="login__path" viewBox="0 0 600 600"><path d="M-20 520 C 120 420, 200 560, 320 380 S 520 120, 640 80" /></svg>
      <svg class="login__plane" viewBox="0 0 64 64"><path d="M60 28 40 26 24 4h-6l8 22-14-1-6-7H1l4 14-4 14h5l6-7 14-1-8 22h6l16-22 20-2a4 4 0 0 0 0-8z"/></svg>
      <div class="login__brand"><img src="/assets/logo.svg" alt="" /><b>LUMI</b><small>TRAVEL · ADMIN</small></div>
      <p>Quản lý tour, đơn đặt và nội dung website ở một nơi.</p>
    </div>
    <form class="login__form" id="loginForm">
      <h1>Đăng nhập quản trị</h1>
      <p>Nhập mật khẩu quản trị để tiếp tục.</p>
      <label class="in"><span>Mật khẩu</span><input type="password" name="password" autocomplete="current-password" required autofocus /></label>
      <button class="abtn abtn--primary abtn--block" type="submit">Đăng nhập</button>
      <a href="/" class="login__back">← Về trang chủ</a>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a href="#/dashboard" class="side__brand"><img src="/assets/logo.svg" alt="" /><span><b>LUMI</b><small>Quản trị</small></span></a>
      <nav class="side__nav">
        <a href="#/dashboard" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>Tổng quan</a>
        <a href="#/bookings" data-route="bookings"><svg viewBox="0 0 24 24"><path d="M19 3h-4.2A3 3 0 0 0 12 1a3 3 0 0 0-2.8 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm-2 14-4-4 1.4-1.4L10 14.2l6.6-6.6L18 9z"/></svg>Đơn đặt tour<em class="side__badge" id="newBadge" hidden></em></a>
        <a href="#/tours" data-route="tours"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>Tour</a>
        <a href="#/destinations" data-route="destinations"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>Điểm đến</a>
        <a href="#/posts" data-route="posts"><svg viewBox="0 0 24 24"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 4v2h12V7zm0 4v2h12v-2zm0 4v2h8v-2z"/></svg>Cẩm nang</a>
        <a href="#/reviews" data-route="reviews"><svg viewBox="0 0 24 24"><path d="m12 2 3 6.9 7.5.7-5.7 5 1.7 7.4L12 18.3 5.5 22l1.7-7.4L1.5 9.6 9 8.9z"/></svg>Đánh giá</a>
        <a href="#/subscribers" data-route="subscribers"><svg viewBox="0 0 24 24"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4 7.3V17h16V7.3z"/></svg>Đăng ký nhận tin</a>
        <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>Cài đặt</a>
        <i class="side__ink"></i>
      </nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener" class="side__site">↗ Xem website</a>
        <button class="side__logout" id="logout">Đăng xuất</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menuBtn" aria-label="Menu"><i></i><i></i><i></i></button>
        <div class="topbar__title"><small id="crumb">Lumi Travel</small><h1 id="pageTitle">Tổng quan</h1></div>
        <div class="topbar__actions" id="topActions"></div>
      </header>
      <main class="view" id="view"></main>
    </div>
  </div>

  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer__scrim"></div><div class="drawer__panel"></div></div>
  <div class="modal" id="modal" aria-hidden="true"><div class="modal__scrim"></div><div class="modal__box"></div></div>
  <div class="atoast" id="atoast" role="status"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
